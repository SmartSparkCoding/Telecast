<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Telecast</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/theme/theme.css" />
    <link rel="stylesheet" href="/display.css" />
  </head>
  <body>
    <main id="stage" data-scene="idle">
      <div class="bg"></div>
      <div class="leaves" id="leaves" aria-hidden="true"></div>

      <!-- Nothing scheduled: the time, a welcome line and some company. -->
      <section class="scene idle active" data-scene="idle">
        <div class="stickers" id="stickers" aria-hidden="true"></div>
        <img class="mascot" id="mascot" src="/theme/mascot.webp" alt="" hidden />
        <img class="idle-logo" src="/theme/logo.webp" alt="" data-logo />
        <div class="clock idle-clock" data-clock></div>
        <p class="idle-date" data-date></p>
        <p class="idle-message" id="idleMessage">Welcome to the Christmas Fair!</p>
        <p class="sign idle-next" id="idleNext" hidden>
          <svg class="roundel" viewBox="0 0 40 40" aria-hidden="true">
            <path d="M16 5h8" stroke="var(--c-gold)" stroke-width="3" stroke-linecap="round" />
            <path d="M17 9h6" stroke="var(--c-gold)" stroke-width="3" stroke-linecap="round" />
            <circle cx="20" cy="24" r="12" fill="var(--c-red)" />
            <path d="M14 21a7 7 0 0 1 6-6" stroke="rgb(255 255 255 / 0.5)" stroke-width="2.5" fill="none" stroke-linecap="round" />
          </svg>
          <span class="sign-label">Next up</span>
          <b id="idleNextTime"></b>
          <span id="idleNextTitle"></span>
        </p>
      </section>

      <section class="scene schedule" data-scene="schedule">
        <div class="schedule-side">
          <p class="sign">
            <svg class="roundel" viewBox="0 0 40 40" aria-hidden="true">
              <path d="M16 5h8" stroke="var(--c-gold)" stroke-width="3" stroke-linecap="round" />
              <path d="M17 9h6" stroke="var(--c-gold)" stroke-width="3" stroke-linecap="round" />
              <circle cx="20" cy="24" r="12" fill="var(--c-red)" />
              <path d="M14 21a7 7 0 0 1 6-6" stroke="rgb(255 255 255 / 0.5)" stroke-width="2.5" fill="none" stroke-linecap="round" />
            </svg>
            Schedule
          </p>
          <h2>On the day</h2>
          <div class="now-card" id="nowCard">
            <p class="now-label" id="nowLabel">Now</p>
            <p class="now-title" id="nowTitle"></p>
            <p class="now-next" id="nowNext"></p>
          </div>
        </div>
        <div class="board">
          <div class="board-head">
            <span id="boardTitle"></span>
            <span id="boardPlatform"></span>
          </div>
          <ol class="rows" id="rows"></ol>
        </div>
      </section>

      <section class="scene countdown" data-scene="countdown">
        <p class="countdown-label" id="countdownLabel"></p>
        <div class="clock countdown-digits" id="countdownDigits"></div>
        <p class="countdown-done" id="countdownDone" hidden></p>
        <p class="countdown-until" id="countdownUntil"></p>
      </section>

      <section class="scene message" data-scene="message">
        <article class="card" id="messageCard">
          <p class="sign card-kicker"></p>
          <h1 class="card-title"></h1>
          <p class="card-body"></p>
        </article>
      </section>

      <section class="scene gallery" data-scene="gallery">
        <div class="gallery-wrap">
          <p class="gallery-title" id="galleryTitle"></p>
          <div class="gallery-grid" id="galleryGrid" data-layout="1"></div>
          <p class="gallery-empty" id="galleryEmpty" hidden>No pictures yet. Add them on the control panel.</p>
        </div>
      </section>

      <section class="scene embed" data-scene="embed">
        <iframe
          id="embedFrame"
          title="Embedded website"
          referrerpolicy="no-referrer"
          allow="autoplay; fullscreen; encrypted-media"
        ></iframe>
        <p class="embed-empty" id="embedEmpty">No website has been set yet.</p>
      </section>

      <header class="chrome">
        <img class="chrome-logo" src="/theme/logo.webp" alt="" data-logo />
        <div class="clock chrome-clock" data-clock></div>
      </header>

      <div class="ticker" id="ticker" hidden><span id="tickerText"></span></div>

      <!-- A flash announcement sits on top of every scene until it expires or is cleared. -->
      <div class="alert" id="alert" hidden>
        <article class="card" id="alertCard">
          <p class="sign card-kicker"></p>
          <h1 class="card-title"></h1>
          <p class="card-body"></p>
          <div class="alert-progress" id="alertProgress"><i></i></div>
        </article>
      </div>

      <p class="offline" id="offline" hidden>Reconnecting…</p>
      <p class="debug" id="debug" hidden></p>
    </main>
    <noscript>
      <p class="offline">This screen needs JavaScript. Enable it, or check the browser's policy, then reload.</p>
    </noscript>
    <script type="module" src="/display.js"></script>
  </body>
</html>
